name: Complete HNC hymn data

on:
  push:
    branches:
      - data/complete-hnc-hymns

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/complete-hnc-hymns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check 'pdfplumber==0.11.9'

      - name: Generate hymns
        run: python scripts/generate_hinario_from_pdf.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('data/hinario').glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'validated {len(files)} JSON files')
          PY
          git diff --check

      - name: Remove temporary generator
        run: |
          rm -f scripts/generate_hinario_from_pdf.py
          rm -f .github/workflows/complete-hinario.yml

      - name: Commit generated hymns
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'data: complete Hinário Novo Cântico'
          git push origin HEAD:data/complete-hnc-hymns
